name: CLI Release

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path cli/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path cli/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path cli/Cargo.toml --all-targets
      - run: cargo build --locked --bin lux
      - run: cargo build --locked --manifest-path cli/Cargo.toml
      - run: bash cli/tests/e2e-local.sh

  build:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: lux-cli-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: lux-cli-linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: lux-cli-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-15
            artifact: lux-cli-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (Linux musl)
        if: contains(matrix.target, 'linux-musl')
        run: cd cli && CC=musl-gcc cargo build --locked --release --target ${{ matrix.target }}

      - name: Build (macOS)
        if: "!contains(matrix.target, 'linux-musl')"
        run: cd cli && cargo build --locked --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp cli/target/${{ matrix.target }}/release/lux ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          merge-multiple: true

      - run: |
          cd artifacts
          for path in ./lux-cli-*; do
            f=${path#./}
            chmod +x "$f"
            tar czf "${f}.tar.gz" "$f"
          done
          sha256sum -- *.tar.gz > SHA256SUMS

      - name: Attest CLI provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/*.tar.gz

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
