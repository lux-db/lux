name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - run: bash .github/scripts/check-release-tag.sh engine "$GITHUB_REF_NAME" "$GITHUB_SHA"

  supply-chain:
    uses: ./.github/workflows/supply-chain.yml

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  build:
    needs: [supply-chain, test, validate]
    env:
      LUX_BUILD_SHA: ${{ github.sha }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: lux-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            name: lux-linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: lux-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (Linux musl)
        if: contains(matrix.target, 'linux-musl')
        run: CC=musl-gcc cargo build --locked --release --target ${{ matrix.target }}

      - name: Build (macOS)
        if: "!contains(matrix.target, 'linux-musl')"
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/lux ${{ matrix.name }}

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: binaries
          merge-multiple: true

      - name: Generate checksums
        run: cd binaries && sha256sum lux-* > SHA256SUMS

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: binaries/lux-*

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: binaries/*
          generate_release_notes: true
