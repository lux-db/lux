name: Supply-chain policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Enforce advisory exception expiry
        env:
          RSA_EXCEPTION_EXPIRES: '2026-09-30'
        run: |
          if [[ "$(date -u +%F)" > "$RSA_EXCEPTION_EXPIRES" ]]; then
            echo "The reviewed RSA advisory exception expired on $RSA_EXCEPTION_EXPIRES."
            exit 1
          fi

      - name: Install dependency policy tool
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check Engine advisories and licenses
        run: cargo deny --manifest-path Cargo.toml check advisories licenses

      - name: Check CLI advisories and licenses
        run: cargo deny --manifest-path cli/Cargo.toml check advisories licenses

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'

      - name: Check SDK advisories and licenses
        working-directory: sdk
        run: bun install --frozen-lockfile && bun audit && bun run licenses
