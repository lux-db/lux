name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release

  cli-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --bin lux
      - run: cargo build --manifest-path cli/Cargo.toml
      - run: bash cli/tests/e2e-local.sh

  cluster-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path bench/cluster/Cargo.toml -- --check
      - run: cargo clippy --manifest-path bench/cluster/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path bench/cluster/Cargo.toml --all-targets
      - run: cargo build --bin lux
      - name: Prove out-of-process Engine orchestration
        env:
          LUX_BENCH_ENGINE_BIN: ${{ github.workspace }}/target/debug/lux
        run: cargo test --manifest-path bench/cluster/Cargo.toml --test local_process -- --ignored

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
