name: Tests

on:
  push:
    branches:
      - main
      - release/1.0
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: ./.github/workflows/supply-chain.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: bash .github/scripts/assert_rust_tests.sh 1200 cargo test --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: bash ../.github/scripts/assert_rust_tests.sh 75 cargo test --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release

  cli-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - run: cargo build --locked --bin lux
      - run: cargo build --locked --manifest-path cli/Cargo.toml
      - run: bash cli/tests/e2e-local.sh

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun test tests --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - run: bun ../.github/scripts/check-coverage.ts sdk coverage/lcov.info
      - run: bun run build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-06-22
          components: llvm-tools-preview
      - name: Install coverage tooling
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Measure Engine coverage
        run: |
          mkdir -p target/coverage
          cargo llvm-cov \
            --locked \
            --all-targets \
            --all-features \
            --branch \
            --json \
            --summary-only \
            --output-path target/coverage/engine.json
          bun .github/scripts/check-coverage.ts engine target/coverage/engine.json
      - name: Measure CLI unit and local-stack coverage
        run: |
          cd cli
          eval "$(cargo llvm-cov show-env --branch --sh)"
          cargo test --locked --all-targets
          cargo build --locked --bin lux
          LUX_E2E_ENGINE_BIN="$GITHUB_WORKSPACE/target/llvm-cov-target/debug/lux" \
          LUX_E2E_CLI_BIN="$GITHUB_WORKSPACE/cli/target/debug/lux" \
            bash tests/e2e-local.sh
          cargo llvm-cov report \
            --branch \
            --json \
            --summary-only \
            --output-path ../target/coverage/cli.json
          bun ../.github/scripts/check-coverage.ts cli ../target/coverage/cli.json
